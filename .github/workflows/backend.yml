name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'BE/**'        

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: |
          cd BE
          npm install
      
      - name: Run tests
        run: |
          cd BE
          npm run test:jest